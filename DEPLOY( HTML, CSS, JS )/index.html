<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Virtual Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   

    <div class="page-container">

        <div class="login-card">

            <div class="logo">
                📊
            </div>

            <h1>Power BI Virtual Dashboard</h1>

            <p class="subtitle">
                Access the interactive data analysis dashboard.
            </p>

            <div class="info-box">
                <strong>Important:</strong>
                <p>
                    You have to make a Zoho Mail account (free) to be able
                    to view my virtual POWER BI report/dashboard.
                    Otherwise, it is a paid process.
                </p>
            </div>

            <div class="button-group">

                <button class="btn primary" onclick="createZohoAccount()">
                    Create Free Zoho Mail Account
                </button>

                <button class="btn secondary" onclick="signInZoho()">
                    Log In to Zoho Mail
                </button>

                <button class="btn report-btn" onclick="showReport()">
                    View Power BI Report →
                </button>

            </div>

            <p class="footer-text">
                Secure access • Interactive Dashboard • Power BI
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
