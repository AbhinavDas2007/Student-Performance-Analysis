<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Power BI Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="report-note">
    💡 <strong>Note:</strong> Please manually minimize the report if it appears enlarged.
    </div>

    <div class="report-container">

        <div class="report-header">

            <div>
                <h1>Power BI Dashboard</h1>
                <p>Interactive Student Data Analysis</p>
            </div>

            <button class="back-btn" onclick="goBack()">
                ← Back
            </button>

        </div>

        <div class="powerbi-container">

            <iframe
                title="Power BI Report"
                width="100%"
                height="100%"
                src="https://app.powerbi.com/reportEmbed?reportId=499c6632-ffc7-4a6d-9491-3e7391b41085&autoAuth=true&ctid=56c1d497-700b-49cf-8f8d-3dd6b20d522f"
                frameborder="0"
                allowFullScreen="true">
            </iframe>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
